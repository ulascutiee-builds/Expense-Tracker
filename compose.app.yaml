services:
  web:
    build: ./backend
    container_name: expense-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      DB_USER: ${DB_USER:?Please set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Please set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Please set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "192.168.93.128:8080:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
