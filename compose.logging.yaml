services:
  loki:
    image: grafana/loki:3.5.5
    container_name: expense-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: expense-docker-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      POST: "0"
      EXEC: "0"
      IMAGES: "0"
      SERVICES: "0"
      NETWORKS: "1"
      VOLUMES: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-api
    security_opt:
      - no-new-privileges:true

  promtail:
    image: grafana/promtail:3.5.5
    container_name: expense-promtail
    restart: unless-stopped
    command:
      - -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - promtail-positions:/tmp
    networks:
      - backend
      - docker-api
    depends_on:
      - loki
      - docker-socket-proxy
    security_opt:
      - no-new-privileges:true

networks:
  docker-api:
    internal: true

volumes:
  loki-data:
  promtail-positions:
